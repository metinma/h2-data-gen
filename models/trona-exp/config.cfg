[run]
enabled = true              # false skips this model.
n_simulations = 10000
debug = false               # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.

[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

[parameter.water_fraction]
distribution = lognormal
low = 1e-6
high = 1e-4
median = 1e-6
sigma_log10 = 1.0

[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-6
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CH4}

[parameter.Trona_pct]
distribution = uniform
low = 37.2
high = 86.8

[parameter.Quartz_pct]
distribution = uniform
low = 2.4
high = 5.6

[parameter.Illite_pct]
distribution = uniform
low = 3.6
high = 8.4

[parameter.Northupite_pct]
distribution = uniform
low = 7.8
high = 18.2

[parameter.Shortite_pct]
distribution = uniform
low = 4.2
high = 9.8

[parameter.Searlesite_pct]
distribution = uniform
low = 4.8
high = 11.2

[mineral.Trona]
fraction_parameter = Trona_pct
moles_placeholder = {TRONA_MOLES}
area_placeholder = {TRONA_AREA}
diameter_m = 1e-4
density_kg_m3 = 2140.0
molar_mass_kg_mol = 258.24e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Quartz]
fraction_parameter = Quartz_pct
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 2e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 60.084e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Illite]
fraction_parameter = Illite_pct
moles_placeholder = {ILLITE_MOLES}
area_placeholder = {ILLITE_AREA}
diameter_m = 1e-5
density_kg_m3 = 2750.0
molar_mass_kg_mol = 383.9e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Northupite]
fraction_parameter = Northupite_pct
moles_placeholder = {NORTHUPITE_MOLES}
area_placeholder = {NORTHUPITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2380.0
molar_mass_kg_mol = 248.74e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Shortite]
fraction_parameter = Shortite_pct
moles_placeholder = {SHORTITE_MOLES}
area_placeholder = {SHORTITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2600.0
molar_mass_kg_mol = 306.16e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Searlesite]
fraction_parameter = Searlesite_pct
moles_placeholder = {SEARLESITE_MOLES}
area_placeholder = {SEARLESITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2460.0
molar_mass_kg_mol = 203.98e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, CO2_g_mol, CH4_g_mol, N2_g_mol, H2S_g_mol, SO4_mol,
              Formate, Acetate, HS-_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot,
              X_SRB_mol, X_IRB_mol, Trona-K_mol, Quartz_mol, Illite_mol, Northupite_mol, Shortite_mol, Searlesite_mol
must_change =
change_atol = 1e-14

[output]
input_file = {TEMPERATURE}, {POROSITY}, {WATER_VOLUME}, {GAS_VOLUME},
             {H2}, {CH4}, {CO2}, {N2}, {H2S},
             {TRONA_MOLES}, {TRONA_AREA},
             {QUARTZ_MOLES}, {QUARTZ_AREA},
             {ILLITE_MOLES}, {ILLITE_AREA},
             {NORTHUPITE_MOLES}, {NORTHUPITE_AREA},
             {SHORTITE_MOLES}, {SHORTITE_AREA},
             {SEARLESITE_MOLES}, {SEARLESITE_AREA}
drop_columns = Ca_tot, S6_tot   # Left out of the output files. Duplicates of Ca_mol and SO4_mol.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Gas and organics]
columns = H2_g_mol, CO2_g_mol, SO4_mol, Formate, Acetate, Ca_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Ca Fe HS-]
columns = Ca_mol, Fe_mol, HS-_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Iron reduction]
columns = IR_H2, IR_AC, IR_FOR
scale = 1
ylabel = Kinetic reactant (mol)

[plot.Solution]
columns = HCO3_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
scale = 1000
ylabel = Amount (mmol)

[plot.Minerals]
columns = Trona-K_mol, Quartz_mol, Illite_mol, Northupite_mol, Shortite_mol, Searlesite_mol
scale = 1
ylabel = Moles
