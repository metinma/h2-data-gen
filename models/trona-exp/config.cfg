# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).
#
# trona-exp: Beypazarı trona, from our dry batch experiment (Trona-K, quartz,
# illite, northupite, shortite, searlesite; 2 bar H2 + 58 bar N2, 35 °C). Scaled up to the reservoir like the other models: a 1 m³ REV whose
# pore space (porosity) is shared between water and gas, with N2 as the
# cushion gas.

[run]
enabled = true              # false skips this model.
n_simulations = 10
debug = true                # true: smoke test, PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, N2, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pCH4 and the mineral fraction parameters.

# Porosity: normal, as in the other models.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the other models; the base model's 35 °C is
# inside the range. Sets the solution, gas and reaction temperatures.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: the base model is dry (a film of
# water only), so a tiny amount: lognormal from 1e-6 to 1e-4 of the pore
# volume (about 1e-4 to 0.03 kg in the REV). The halite or trona stays
# saturated, as in the base.
[parameter.water_fraction]
distribution = lognormal
low = 1e-6
high = 1e-4
median = 1e-5
sigma_log10 = 0.5

# Gas partial pressures (atm): lognormal, since each spans orders of
# magnitude. The same distributions in all four exp models. H2 is fixed at
# 2 atm (as in the experiment) and N2, the cushion gas, takes whatever the
# others leave of the 60 atm (cushion_gas in [model]). The experiments' gas
# had only H2 and N2, so the medians are typical reservoir values:
#   pCO2  median 0.1 atm, 1e-5 to 10 atm
#   pH2S  median 1e-4 atm (~2 ppm), 1e-6 to 1e-2 atm
#   pCH4  residual or biogenic methane: median 0.3 atm (0.5 mol%; ~0.15 atm
#         after the cut at 10 atm), 1e-6 to 10 atm (~17 mol%);
#         sigma_log10 = 1.5 puts ~6% of runs below 1e-3 atm.
# pH2S and pCH4 at 1e-6 stand in for "absent". N2 ends up between 38 and
# 58 atm.
[parameter.pCO2]
distribution = lognormal
low = 1e-5
high = 10.0
median = 0.1
sigma_log10 = 1.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-4
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.3
sigma_log10 = 1.5
placeholder = {CH4}

# Mineral mass percentages of the solid (see [mineral.*] below). Base values
# are the base model's -m0 masses: Trona-K 33.6 g, quartz 1.8 g, illite 3.0 g,
# northupite 6.5 g, shortite 5.8 g, searlesite 2.2 g, i.e. Trona 63.5 / Quartz
# 3.41 / Illite 5.6 / Northupite 12.3 / Shortite 11 / Searlesite 4.24 %.
# datagen.py converts them to volume fractions with the densities. The range
# is 0.6x to 1.4x of each, then scaled to sum to 100 %, as in the other multi-
# mineral models.
[parameter.Trona_pct]
distribution = uniform
low = 38.09
high = 88.87

[parameter.Quartz_pct]
distribution = uniform
low = 2.045
high = 4.771

[parameter.Illite_pct]
distribution = uniform
low = 3.359
high = 7.838

[parameter.Northupite_pct]
distribution = uniform
low = 7.366
high = 17.19

[parameter.Shortite_pct]
distribution = uniform
low = 6.6
high = 15.4

[parameter.Searlesite_pct]
distribution = uniform
low = 2.545
high = 5.94

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its mass percentage of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
# reactive_fraction = 1e-3 on moles and area, as in the other models.
# diameter_m is the grain size that gives the base model's -parms area for
# its -m0 moles (A = 6 m / (rho d)): Trona-K 0.869 m² -> 110 µm, quartz
# 0.022 m² -> 186 µm, illite 0.65 m² -> 10 µm, northupite 0.163 m² ->
# 100 µm, shortite 0.10 m² -> 134 µm, searlesite 0.08 m² -> 68 µm.
# Densities as in the other models where they have the mineral (Trona 2110
# as in trona, illite 2700 as in sandstone, quartz 2650); the rest from the
# base model's header (northupite 2380, shortite 2600, searlesite 2460).
# Molar masses from the template's formulas (Trona-K is K2NaH(CO3)2:2H2O).
# -----------------------------------------------------------------------------
# Trona-K in the template
[mineral.Trona]
fraction_parameter = Trona_pct
moles_placeholder = {TRONA_MOLES}
area_placeholder = {TRONA_AREA}
diameter_m = 1.099e-4
density_kg_m3 = 2110.0
molar_mass_kg_mol = 258.24e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Quartz]
fraction_parameter = Quartz_pct
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 1.855e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 60.084e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Illite]
fraction_parameter = Illite_pct
moles_placeholder = {ILLITE_MOLES}
area_placeholder = {ILLITE_AREA}
diameter_m = 1.012e-5
density_kg_m3 = 2700.0
molar_mass_kg_mol = 383.9e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Northupite]
fraction_parameter = Northupite_pct
moles_placeholder = {NORTHUPITE_MOLES}
area_placeholder = {NORTHUPITE_AREA}
diameter_m = 1.004e-4
density_kg_m3 = 2380.0
molar_mass_kg_mol = 248.74e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Shortite]
fraction_parameter = Shortite_pct
moles_placeholder = {SHORTITE_MOLES}
area_placeholder = {SHORTITE_AREA}
diameter_m = 1.342e-4
density_kg_m3 = 2600.0
molar_mass_kg_mol = 306.16e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Searlesite]
fraction_parameter = Searlesite_pct
moles_placeholder = {SEARLESITE_MOLES}
area_placeholder = {SEARLESITE_AREA}
diameter_m = 6.841e-5
density_kg_m3 = 2460.0
molar_mass_kg_mol = 203.98e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, N2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol,
              X_SRB_mol, X_IRB_mol, Trona-K_mol, Quartz_mol, Illite_mol,
              Northupite_mol, Shortite_mol, Searlesite_mol
# Off for now: no column has been confirmed to change in every run.
must_change =
change_atol = 1e-14

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value".
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {CH4}, {CO2}, {N2}, {H2S},
             {TRONA_MOLES}, {TRONA_AREA},
             {QUARTZ_MOLES}, {QUARTZ_AREA},
             {ILLITE_MOLES}, {ILLITE_AREA},
             {NORTHUPITE_MOLES}, {NORTHUPITE_AREA},
             {SHORTITE_MOLES}, {SHORTITE_AREA},
             {SEARLESITE_MOLES}, {SEARLESITE_AREA}
drop_columns =                  # Left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row.

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# -----------------------------------------------------------------------------
[plot.Gas composition]
columns = H2_cmol, N2_cmol, CO2_cmol, CH4_cmol
scale = 1
ylabel = Gas (cmol/mol)

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Gas amounts]
columns = H2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Minerals]
columns = Trona-K_mol, Northupite_mol, Shortite_mol, Searlesite_mol, Illite_mol, Quartz_mol
scale = 1
ylabel = Moles

[plot.Microbial reactions]
columns = SR_H2, IR_H2
scale = 1
ylabel = Kinetic reactant (mol)
