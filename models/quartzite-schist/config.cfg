# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).

[run]
enabled = false              # false skips this model.
n_simulations = 8
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 4                 # Parallel PHREEQC runs.
timeout_s = 7200            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = CH4           # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - N2.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#                 (keeps the base model's ratio to another parameter)
#
# The bounds are the ranges of the original script
# (Quartzite_schist.py). Where a distribution has
# a centre, it is the base value of the original script, and the spread puts
# the bounds at about 2 standard deviations ((log10 high - log10 low) / 4).
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, CH4, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pN2 and the mineral fraction parameters.

# Porosity: normal. Classic result for reservoir rock (Law, cited in
# Bennion & Griffiths 1966, SPE J.); permeability is the lognormal one.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the Trona model.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 36.6
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: uniform, as in the Trona model.
[parameter.water_fraction]
distribution = uniform
low = 0.01
high = 0.99

# Dissolved species (mol/kgw): lognormal, as in the Trona model (Ahrens 1954;
# groundwater background studies). Medians are the base values.
# Entered in the template as Alkalinity ... as SO4-2 (eq/kgw).
[parameter.SO4]
distribution = lognormal
low = 1e-05
high = 0.03
median = 0.01031
sigma_log10 = 0.87
placeholder = {SO4}

[parameter.Na]
distribution = lognormal
low = 0.001
high = 0.5
median = 0.06842
sigma_log10 = 0.67
placeholder = {NA}

[parameter.K]
distribution = lognormal
low = 0.0001
high = 0.05
median = 0.006062
sigma_log10 = 0.67
placeholder = {K}

[parameter.Ca]
distribution = lognormal
low = 1e-05
high = 0.02
median = 8.084e-05
sigma_log10 = 0.83
placeholder = {CA}

# The base value (6.994e-7) is below this range's lower bound (1e-6),
# so the median is the geometric centre of the range instead.
[parameter.Mg]
distribution = lognormal
low = 1e-06
high = 0.01
median = 0.0001
sigma_log10 = 1.0
placeholder = {MG}

[parameter.Fe2]
distribution = lognormal
low = 1e-07
high = 0.0001
median = 1.343e-06
sigma_log10 = 0.75
placeholder = {FE(2)}

# The base value (9.649e-3) is above this range's upper bound (2e-3),
# so the median is the geometric centre of the range instead.
[parameter.Si]
distribution = lognormal
low = 1e-05
high = 0.002
median = 0.00014142
sigma_log10 = 0.58
placeholder = {SI}

[parameter.Al]
distribution = lognormal
low = 1e-08
high = 5e-05
median = 2.001e-05
sigma_log10 = 0.92
placeholder = {AL}

# Cl and Mn keep the base ratios to Na and Mg, as in the original script.
[parameter.Cl]
distribution = proportional
to = Na
base = 4.682e-3
base_to = 6.842e-2
placeholder = {CL}

[parameter.Mn]
distribution = proportional
to = Mg
base = 7.281e-7
base_to = 6.994e-7
placeholder = {MN}

# Gas partial pressures (atm): lognormal. Non-hydrocarbon gas contents in
# natural gas range from traces to large fractions and are strongly
# right-skewed; lognormal is the usual choice for such data, but I found no
# source fitting it to CO2, N2 or H2S specifically. Medians are the base model.
[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 3.68428
sigma_log10 = 1.75
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 0.003684
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pN2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.92107
sigma_log10 = 1.75
placeholder = {N2}

# Mineral mass percentages of the solid (see [mineral.*] below): uniform
# within +/-40 % of the base value, then scaled to sum to 100 %, as in the
# original script. Base: Quartz 94.4 / Muscovite 2.69 / Paragonite 1.39 /
# Albite 0.69 / Andalusite 0.469 / Hematite 0.199 / Pyrite 0.188 % (the
# original script's volume fractions converted with the densities; datagen.py
# converts back to volume fractions).
[parameter.Quartz_pct]
distribution = uniform
low = 56.62
high = 132.1

[parameter.Muscovite_pct]
distribution = uniform
low = 1.614
high = 3.767

[parameter.Paragonite_pct]
distribution = uniform
low = 0.8359
high = 1.951

[parameter.Albite_pct]
distribution = uniform
low = 0.4138
high = 0.9655

[parameter.Andalusite_pct]
distribution = uniform
low = 0.2816
high = 0.657

[parameter.Hematite_pct]
distribution = uniform
low = 0.1196
high = 0.279

[parameter.Pyrite_pct]
distribution = uniform
low = 0.1128
high = 0.2632

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its mass percentage of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
#                       (the corrections of the original script)
# -----------------------------------------------------------------------------
[mineral.Quartz]
fraction_parameter = Quartz_pct
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 100e-6
density_kg_m3 = 2650
molar_mass_kg_mol = 60.084e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Muscovite]
fraction_parameter = Muscovite_pct
moles_placeholder = {MUSCOVITE_MOLES}
area_placeholder = {MUSCOVITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 2650
molar_mass_kg_mol = 398.710e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Paragonite]
fraction_parameter = Paragonite_pct
moles_placeholder = {PARAGONITE_MOLES}
area_placeholder = {PARAGONITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 2850
molar_mass_kg_mol = 382.200e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Albite]
fraction_parameter = Albite_pct
moles_placeholder = {ALBITE_MOLES}
area_placeholder = {ALBITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 2620
molar_mass_kg_mol = 263.020e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 0.1

[mineral.Andalusite]
fraction_parameter = Andalusite_pct
moles_placeholder = {ANDALUSITE_MOLES}
area_placeholder = {ANDALUSITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 3120
molar_mass_kg_mol = 162.050e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 10

[mineral.Hematite]
fraction_parameter = Hematite_pct
moles_placeholder = {HEMATITE_MOLES}
area_placeholder = {HEMATITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 5300
molar_mass_kg_mol = 159.690e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Pyrite]
fraction_parameter = Pyrite_pct
moles_placeholder = {PYRITE_MOLES}
area_placeholder = {PYRITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 5000
molar_mass_kg_mol = 119.980e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, CO2_g_mol, CH4_g_mol, SO4_mol, Formate, Acetate,
              Ca_mol, Fe_mol, HS-_mol
# Columns that must change between the first kinetic step and the end.
# Catches switched-off reactions (the MIN bug gives a change of exactly 0).
# Leave empty to switch the check off.
# Off: the MIN bug is kept on purpose, so SR_H2, SR_AC and SR_FOR never change
# and every run would be flagged.
must_change =
change_atol = 1e-14         # Absolute; real progress here is ~1e-8 mol or more.

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value"
# (the format of the original script).
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {SO4}, {NA}, {K}, {CA}, {MG}, {CL}, {MN}, {FE(2)}, {SI}, {AL},
             {CH4}, {CO2}, {N2}, {H2S},
             {QUARTZ_MOLES}, {MUSCOVITE_MOLES}, {PARAGONITE_MOLES}, {ALBITE_MOLES},
             {ANDALUSITE_MOLES}, {HEMATITE_MOLES}, {PYRITE_MOLES},
             {QUARTZ_AREA}, {MUSCOVITE_AREA}, {PARAGONITE_AREA}, {ALBITE_AREA},
             {ANDALUSITE_AREA}, {HEMATITE_AREA}, {PYRITE_AREA}
drop_columns =                  # Columns left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row
                                # (before gas and kinetics are set up: pH 7, no gas, KIN() = 0).

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# scale multiplies the values (1000 converts mol to mmol).
# -----------------------------------------------------------------------------
[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Quartzite_schist model]
columns = H2_g_mol, CO2_g_mol, SO4_mol, Formate, Acetate, Ca_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Hematite and Calcite]
columns = Hematite_mol, Calcite_mol
scale = 1
ylabel = Moles

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Ca Fe HS-]
columns = Ca_mol, Fe_mol, HS-_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Iron reduction]
columns = IR_H2, IR_AC, IR_FOR
scale = 1
ylabel = Kinetic reactant (mol)
