[run]
enabled = true              # false skips this model.
n_simulations = 10
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.

[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

[parameter.HCO3]
distribution = lognormal
low = 5e-4
high = 3e-2
median = 1.9995e-3
sigma_log10 = 0.4
placeholder = {HCO3}

[parameter.Na]
distribution = lognormal
low = 5e-4
high = 1.0
median = 5.6242e-3
sigma_log10 = 1.0
placeholder = {NA}

[parameter.Ca]
distribution = lognormal
low = 1e-5
high = 2e-2
median = 5.6565e-4
sigma_log10 = 0.6
placeholder = {CA}

[parameter.Mg]
distribution = lognormal
low = 5e-5
high = 2e-2
median = 9.0064e-4
sigma_log10 = 0.6
placeholder = {MG}

[parameter.S6]
distribution = lognormal
low = 1e-6
high = 3e-2
median = 2.2777e-3
sigma_log10 = 1.0
placeholder = {S(6)}

[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-6
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CH4}

[parameter.Calcite_pct]
distribution = uniform
low = 48.72
high = 113.7

[parameter.Illite_pct]
distribution = uniform
low = 11.28
high = 26.31

[mineral.Calcite]
fraction_parameter = Calcite_pct
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 1.000e-4
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.087e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Illite]
fraction_parameter = Illite_pct
moles_placeholder = {ILLITE_MOLES}
area_placeholder = {ILLITE_AREA}
diameter_m = 1e-6
density_kg_m3 = 2700.0
molar_mass_kg_mol = 383.9e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 0.01555

[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, N2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol,
              X_SRB_mol, X_IRB_mol, Calcite_mol, Illite_mol,
              Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL
must_change =
change_atol = 1e-14

[output]
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {CA}, {MG}, {S(6)},
             {CH4}, {CO2}, {N2}, {H2S},
             {CALCITE_MOLES}, {CALCITE_AREA},
             {ILLITE_MOLES}, {ILLITE_AREA}
drop_columns =                  # Left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row.

[plot.Gas composition]
columns = H2_cmol, N2_cmol, CO2_cmol, CH4_cmol
scale = 1
ylabel = Gas (cmol/mol)

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Water chemistry]
columns = Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL, Alk_HCO3_mgL
scale = 1
ylabel = mg/L

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Minerals]
columns = Calcite_mol, Illite_mol
scale = 1
ylabel = Moles

[plot.Microbial reactions]
columns = SR_H2, IR_H2
scale = 1
ylabel = Kinetic reactant (mol)
