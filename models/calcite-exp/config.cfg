[run]
enabled = true              # false skips this model.
n_simulations = 10000
debug = false               # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.

[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

[parameter.HCO3]
distribution = lognormal
low = 5e-4
high = 3e-2
median = 1.9995e-3
sigma_log10 = 0.4
placeholder = {HCO3}

[parameter.Na]
distribution = lognormal
low = 5e-4
high = 1.0
median = 5.6242e-3
sigma_log10 = 1.0
placeholder = {NA}

[parameter.Ca]
distribution = lognormal
low = 1e-5
high = 2e-2
median = 5.6565e-4
sigma_log10 = 0.6
placeholder = {CA}

[parameter.Mg]
distribution = lognormal
low = 5e-5
high = 2e-2
median = 9.0064e-4
sigma_log10 = 0.6
placeholder = {MG}

[parameter.S6]
distribution = lognormal
low = 1e-6
high = 3e-2
median = 2.2777e-3
sigma_log10 = 1.0
placeholder = {S(6)}

[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-6
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 1e-6
sigma_log10 = 2.0
placeholder = {CH4}

[parameter.Calcite_pct]
distribution = uniform
low = 48.72
high = 113.7

[parameter.Illite_pct]
distribution = uniform
low = 11.28
high = 26.31

[mineral.Calcite]
fraction_parameter = Calcite_pct
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 1.000e-4
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.087e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Illite]
fraction_parameter = Illite_pct
moles_placeholder = {ILLITE_MOLES}
area_placeholder = {ILLITE_AREA}
diameter_m = 1e-6
density_kg_m3 = 2700.0
molar_mass_kg_mol = 383.9e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 0.01555

[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, CO2_g_mol, CH4_g_mol, N2_g_mol, H2S_g_mol, SO4_mol,
              Formate, Acetate, HS-_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot,
              X_SRB_mol, X_IRB_mol, Calcite_mol, Illite_mol
must_change =
change_atol = 1e-14

[output]
input_file = {TEMPERATURE}, {POROSITY}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {CA}, {MG}, {S(6)},
             {H2}, {CH4}, {CO2}, {N2}, {H2S},
             {CALCITE_MOLES}, {CALCITE_AREA},
             {ILLITE_MOLES}, {ILLITE_AREA}
drop_columns = Ca_tot, S6_tot   # Left out of the output files. Duplicates of Ca_mol and SO4_mol.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Gas and organics]
columns = H2_g_mol, CO2_g_mol, SO4_mol, Formate, Acetate, Ca_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Ca Fe HS-]
columns = Ca_mol, Fe_mol, HS-_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Iron reduction]
columns = IR_H2, IR_AC, IR_FOR
scale = 1
ylabel = Kinetic reactant (mol)

[plot.Solution]
columns = HCO3_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
scale = 1000
ylabel = Amount (mmol)

[plot.Minerals]
columns = Calcite_mol, Illite_mol
scale = 1
ylabel = Moles
