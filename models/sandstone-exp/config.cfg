# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).
#
# sandstone-exp: Haymana sandstone, from our batch experiment (quartz,
# calcite, albite, K-feldspar, Montmor-Na, Chlorite(14A); Na-loaded clay
# exchanger; synthetic aquifer water; 2 bar H2 + 58 bar N2, 40 °C). Scaled up to the reservoir like the other
# models: a 1 m³ REV whose pore space (porosity) is shared between water and
# gas, with N2 as the cushion gas.

[run]
enabled = true              # false skips this model.
model_encoding = utf-8      # Encoding of the .phr file, e.g. utf-8, cp1252, cp1254.
n_simulations = 10
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.
smoke_test = true           # Run the median of every parameter once before the batch.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[sampling]
seed = auto                 # auto or an integer. The seed used is stored in the run.

[model]
volume_m3 = 1.0
total_pressure_atm = 60.0   # Must match "-pressure" in the template.
h2_pressure_atm = 2.0       # Fixed in the template as Hdg(g): 2 of 60, as in the experiment.
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.
normalize_mineral_fractions = true  # Scale the mineral fractions to sum to 1.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, N2, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pCH4 and the mineral fraction parameters.

# Porosity: normal, as in the other models.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the other models; the base model's 40 °C is
# inside the range. Sets the solution, gas and reaction temperatures.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: uniform, as in the other models.
[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

# Dissolved species (mol/kgw): lognormal, as in the other models. Medians are
# the base model's water, converted from mg/L. Bounds and sigma_log10 are
# those of the other models: HCO3 as in calcite/dolomite/trona; Na, Ca, Mg
# and SO4 as in the schist models, whose wider bounds contain the base
# values (the calcite-family bounds would leave Na, Mg and SO4 outside).
# The base water has no Cl or K, so they are not sampled.
[parameter.HCO3]
# as alkalinity; base 146.40 mg/L
distribution = lognormal
low = 1e-3
high = 2e-1
median = 2.3993e-3
sigma_log10 = 0.58
placeholder = {HCO3}

[parameter.Na]
# base 226.40 mg/L
distribution = lognormal
low = 1e-3
high = 0.5
median = 9.8478e-3
sigma_log10 = 0.67
placeholder = {NA}

[parameter.Ca]
# base 4.11 mg/L
distribution = lognormal
low = 1e-5
high = 0.02
median = 1.0255e-4
sigma_log10 = 0.83
placeholder = {CA}

[parameter.Mg]
# base 40.10 mg/L
distribution = lognormal
low = 1e-6
high = 0.01
median = 1.6499e-3
sigma_log10 = 1.0
placeholder = {MG}

[parameter.S6]
# as SO4; base 8.80 mg/L
distribution = lognormal
low = 1e-5
high = 0.03
median = 9.1609e-5
sigma_log10 = 0.87
placeholder = {S(6)}

# Gas partial pressures (atm), proportional to the base model: 2 H2 + 58 N2
# out of 60, with N2 as the cushion gas taking whatever the others leave
# (cushion_gas in [model]). pCO2 and pH2S have the bounds and sigma_log10 of
# the other models. Their medians differ: the other models' base gas has
# 3.68 atm CO2 and 0.0037 atm H2S, but this base model has 2 H2 + 58 N2 with 1e-6 CH4 only, so the
# medians are the geometric middles of the bounds. pCH4 has no counterpart
# (CH4 is the cushion gas elsewhere) and uses the pH2S bounds. N2 ends up
# between 48 and 58 atm, 56.5 at the medians.
[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 3.16e-3
sigma_log10 = 1.75
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-4
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-4
sigma_log10 = 1.0
placeholder = {CH4}

# Na-loaded exchanger on the clays (EXCHANGE 1), mol. No other model has one.
# The base model has 0.0005 mol for its rock (the -m0 moles below: 90.8 g,
# 33.9 cm³ of solid); scaled to the REV's solid at the mean porosity (0.8 m³)
# this is 11.8 mol. Constant: datagen.py cannot tie it to each sample's
# porosity.
[parameter.NaX]
distribution = constant
value = 11.79
placeholder = {NAX}

# Mineral volume fractions of the solid (see [mineral.*] below). Base values
# are the base model's -m0 moles converted to volume: quartz 0.457 mol
# (27.5 g), calcite 0.4996 mol (50.0 g), albite 0.02478 mol (6.5 g),
# K-feldspar 0.017964 mol (5.0 g), Montmor-Na 0.002 mol (0.73 g),
# Chlorite(14A) 0.002 mol (1.11 g). The range is 0.6x to 1.4x of each, then
# scaled to sum to 1, as in the other multi-mineral models.
[parameter.Quartz_fraction]
distribution = uniform
low = 0.18329
high = 0.42768

[parameter.Calcite_fraction]
distribution = uniform
low = 0.32639
high = 0.76158

[parameter.Albite_fraction]
distribution = uniform
low = 0.04387
high = 0.10237

[parameter.Kfeldspar_fraction]
distribution = uniform
low = 0.03455
high = 0.08061

[parameter.Montmorillonite_fraction]
distribution = uniform
low = 0.00448
high = 0.01045

[parameter.Chlorite_fraction]
distribution = uniform
low = 0.00742
high = 0.01731

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its volume fraction of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
# reactive_fraction = 1e-3 on moles and area, as in the other models.
# diameter_m is the grain size that gives the base model's -parms area for
# its -m0 moles (A = 6 m / (rho d)): quartz 0.31 m² -> 200 µm, calcite
# 0.243 m² -> 456 µm, albite 0.148 m² -> 101 µm, K-feldspar 0.117 m² ->
# 100 µm, Montmor-Na 0.02 m² -> 76 µm, Chlorite(14A) 0.02 m² -> 126 µm.
# Densities as in the other models where they have the mineral (Montmor-Na
# 2900); chlorite 2650. Albite stands in for plagioclase and K-feldspar for
# alkali feldspar.
# -----------------------------------------------------------------------------
[mineral.Quartz]
fraction_parameter = Quartz_fraction
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 2.005e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 60.084e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Calcite]
fraction_parameter = Calcite_fraction
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 4.556e-4
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.087e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Albite]
fraction_parameter = Albite_fraction
moles_placeholder = {ALBITE_MOLES}
area_placeholder = {ALBITE_AREA}
diameter_m = 1.005e-4
density_kg_m3 = 2620.0
molar_mass_kg_mol = 262.22e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Kfeldspar]
fraction_parameter = Kfeldspar_fraction
moles_placeholder = {KFELDSPAR_MOLES}
area_placeholder = {KFELDSPAR_AREA}
diameter_m = 1.002e-4
density_kg_m3 = 2560.0
molar_mass_kg_mol = 278.33e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# Montmor-Na in the template
[mineral.Montmorillonite]
fraction_parameter = Montmorillonite_fraction
moles_placeholder = {MONTMORILLONITE_MOLES}
area_placeholder = {MONTMORILLONITE_AREA}
diameter_m = 7.593e-5
density_kg_m3 = 2900.0
molar_mass_kg_mol = 367.0e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# Chlorite(14A) in the template
[mineral.Chlorite]
fraction_parameter = Chlorite_fraction
moles_placeholder = {CHLORITE_MOLES}
area_placeholder = {CHLORITE_AREA}
diameter_m = 1.258e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 555.8e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, N2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol,
              X_SRB_mol, X_IRB_mol, Quartz_mol, Calcite_mol, Albite_mol,
              Kfeld_mol, Montmor_mol, Chlorite_mol,
              Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL
# Off for now: no column has been confirmed to change in every run.
must_change =
change_atol = 1e-14

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value".
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {CA}, {MG}, {S(6)}, {NAX},
             {CH4}, {CO2}, {N2}, {H2S},
             {QUARTZ_MOLES}, {QUARTZ_AREA},
             {CALCITE_MOLES}, {CALCITE_AREA},
             {ALBITE_MOLES}, {ALBITE_AREA},
             {KFELDSPAR_MOLES}, {KFELDSPAR_AREA},
             {MONTMORILLONITE_MOLES}, {MONTMORILLONITE_AREA},
             {CHLORITE_MOLES}, {CHLORITE_AREA}
drop_columns =                  # Left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row.

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# -----------------------------------------------------------------------------
[plot.Gas composition]
columns = H2_cmol, N2_cmol, CO2_cmol, CH4_cmol
scale = 1
ylabel = Gas (cmol/mol)

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Water chemistry]
columns = Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL, Alk_HCO3_mgL
scale = 1
ylabel = mg/L

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Minerals]
columns = Calcite_mol, Albite_mol, Kfeld_mol, Montmor_mol, Chlorite_mol
scale = 1
ylabel = Moles

[plot.Exchanger]
columns = NaX_mol, MgX2_mol, CaX2_mol, KX_mol
scale = 1
ylabel = mol/kgw
