# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).
#
# sandstone-exp: Haymana sandstone, from our batch experiment (quartz,
# calcite, albite, K-feldspar, Montmor-Na, Chlorite(14A); Na-loaded clay
# exchanger; synthetic aquifer water; 2 bar H2 + 58 bar N2, 40 °C). Scaled up to the reservoir like the other
# models: a 1 m³ REV whose pore space (porosity) is shared between water and
# gas, with N2 as the cushion gas.

[run]
enabled = true              # false skips this model.
n_simulations = 10
debug = true                # true: smoke test, PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, N2, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pCH4 and the mineral fraction parameters.

# Porosity: normal, as in the other models.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the other models; the base model's 40 °C is
# inside the range. Sets the solution, gas and reaction temperatures.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: uniform, as in the other models.
[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

# Dissolved species (mol/kgw): lognormal, centred on this model's base water
# (Na-HCO3, pH 8; the base's mg/L converted to mol/kgw, noted on each).
# Bounds cover fresh to saline water: Na up to 1 mol/kgw (~60 g/L as NaCl).
# The template has no Cl (it stays as is), so high-Na runs are
# charge-imbalanced; runs that fail are reported as such. Na and SO4 get
# sigma_log10 = 1.0 so that high/low salinity and sulfate-free (SO4 down to
# 1e-6: no SRB substrate) cases are sampled. HCO3, Ca and Mg are narrower,
# held by calcite/dolomite equilibrium.
[parameter.HCO3]
# as alkalinity; base 146.40 mg/L (2.3993e-3)
distribution = lognormal
low = 5e-4
high = 3e-2
median = 2.3994e-3
sigma_log10 = 0.4
placeholder = {HCO3}

[parameter.Na]
# base 226.40 mg/L (9.8478e-3)
distribution = lognormal
low = 5e-4
high = 1.0
median = 9.8478e-3
sigma_log10 = 1.0
placeholder = {NA}

[parameter.Ca]
# base 4.11 mg/L (1.0255e-4)
distribution = lognormal
low = 1e-5
high = 2e-2
median = 1.0255e-4
sigma_log10 = 0.6
placeholder = {CA}

[parameter.Mg]
# base 40.10 mg/L (1.6499e-3)
distribution = lognormal
low = 5e-5
high = 2e-2
median = 1.6499e-3
sigma_log10 = 0.6
placeholder = {MG}

[parameter.S6]
# as SO4; base 8.80 mg/L (9.1609e-5)
distribution = lognormal
low = 1e-6
high = 3e-2
median = 9.1609e-5
sigma_log10 = 1.0
placeholder = {S(6)}

# Gas partial pressures (atm): lognormal, since each spans orders of
# magnitude. The same distributions in all four exp models. H2 is fixed at
# 2 atm (as in the experiment) and N2, the cushion gas, takes whatever the
# others leave of the 60 atm (cushion_gas in [model]). The experiments' gas
# had only H2 and N2, so the medians are typical reservoir values:
#   pCO2  median 0.1 atm, 1e-5 to 10 atm
#   pH2S  median 1e-4 atm (~2 ppm), 1e-6 to 1e-2 atm
#   pCH4  residual or biogenic methane: median 0.3 atm (0.5 mol%; ~0.15 atm
#         after the cut at 10 atm), 1e-6 to 10 atm (~17 mol%);
#         sigma_log10 = 1.5 puts ~6% of runs below 1e-3 atm.
# pH2S and pCH4 at 1e-6 stand in for "absent". N2 ends up between 38 and
# 58 atm.
[parameter.pCO2]
distribution = lognormal
low = 1e-5
high = 10.0
median = 0.1
sigma_log10 = 1.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-4
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.3
sigma_log10 = 1.5
placeholder = {CH4}

# Na-loaded exchanger on the clays (EXCHANGE 1), mol. No other model has one.
# Not sampled. The base model has 0.0005 mol for its 50 g of rock (18.85 cm³
# of solid at the header's composition); scaled to the REV's solid at the
# mean porosity (0.8 m³) this is 21.2 mol.
[parameter.NaX]
distribution = constant
value = 21.22
placeholder = {NAX}

# Mineral mass percentages of the solid (see [mineral.*] below), from the
# base model's header (semi-quantitative XRD, 50 g of rock): quartz 53,
# calcite 22, albite (plagioclase) 13, K-feldspar (alkali feldspar) 10,
# Montmor-Na 1, Chlorite(14A) 1 wt%. datagen.py converts them to volume
# fractions with the densities. The range is 0.6x to 1.4x of each, then
# scaled to sum to 100 %, as in the other multi-mineral models. (The base's
# calcite -m0 0.4996 mol is 50 g; its header and -parms area give 11 g.)
[parameter.Quartz_pct]
distribution = uniform
low = 31.8
high = 74.2

[parameter.Calcite_pct]
distribution = uniform
low = 13.2
high = 30.8

[parameter.Albite_pct]
distribution = uniform
low = 7.8
high = 18.2

[parameter.Kfeldspar_pct]
distribution = uniform
low = 6.0
high = 14.0

[parameter.Montmorillonite_pct]
distribution = uniform
low = 0.6
high = 1.4

[parameter.Chlorite_pct]
distribution = uniform
low = 0.6
high = 1.4

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its mass percentage of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
# reactive_fraction = 1e-3 on moles and area, as in the other models.
# diameter_m from the base model's header: quartz 200 µm, the rest 100 µm
# (the header gives none for the clays; 100 µm as for the others).
# Multipliers keep the header's and the base's values where the wt% alone
# does not give them:
#   quartz: the header's table lists 53 wt% but 27.5 g (0.457690 mol,
#     0.311321 m²); moles and area x 1.0377 (27.5 / 26.5 g).
#   Montmor-Na, Chlorite(14A): the base's -parms area, 0.02 m² each, at
#     1 wt% (0.5 g): area x 1.9333 and x 1.7667.
# Densities as in the other models where they have the mineral (Montmor-Na
# 2900); chlorite 2650. Albite stands in for plagioclase and K-feldspar for
# alkali feldspar.
# -----------------------------------------------------------------------------
[mineral.Quartz]
fraction_parameter = Quartz_pct
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 2e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 60.084e-3
reactive_fraction = 1e-3
moles_multiplier = 1.0377
area_multiplier = 1.0377

[mineral.Calcite]
fraction_parameter = Calcite_pct
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.087e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Albite]
fraction_parameter = Albite_pct
moles_placeholder = {ALBITE_MOLES}
area_placeholder = {ALBITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2620.0
molar_mass_kg_mol = 262.22e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Kfeldspar]
fraction_parameter = Kfeldspar_pct
moles_placeholder = {KFELDSPAR_MOLES}
area_placeholder = {KFELDSPAR_AREA}
diameter_m = 1e-4
density_kg_m3 = 2560.0
molar_mass_kg_mol = 278.33e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# Montmor-Na in the template
[mineral.Montmorillonite]
fraction_parameter = Montmorillonite_pct
moles_placeholder = {MONTMORILLONITE_MOLES}
area_placeholder = {MONTMORILLONITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2900.0
molar_mass_kg_mol = 367.0e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1.9333

# Chlorite(14A) in the template
[mineral.Chlorite]
fraction_parameter = Chlorite_pct
moles_placeholder = {CHLORITE_MOLES}
area_placeholder = {CHLORITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2650.0
molar_mass_kg_mol = 555.8e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1.7667

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, N2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol,
              X_SRB_mol, X_IRB_mol, Quartz_mol, Calcite_mol, Albite_mol,
              Kfeld_mol, Montmor_mol, Chlorite_mol,
              Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL
# Off for now: no column has been confirmed to change in every run.
must_change =
change_atol = 1e-14

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value".
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {CA}, {MG}, {S(6)}, {NAX},
             {CH4}, {CO2}, {N2}, {H2S},
             {QUARTZ_MOLES}, {QUARTZ_AREA},
             {CALCITE_MOLES}, {CALCITE_AREA},
             {ALBITE_MOLES}, {ALBITE_AREA},
             {KFELDSPAR_MOLES}, {KFELDSPAR_AREA},
             {MONTMORILLONITE_MOLES}, {MONTMORILLONITE_AREA},
             {CHLORITE_MOLES}, {CHLORITE_AREA}
drop_columns =                  # Left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row.

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# -----------------------------------------------------------------------------
[plot.Gas composition]
columns = H2_cmol, N2_cmol, CO2_cmol, CH4_cmol
scale = 1
ylabel = Gas (cmol/mol)

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Water chemistry]
columns = Ca_mgL, Mg_mgL, Na_mgL, SO4_mgL, Alk_HCO3_mgL
scale = 1
ylabel = mg/L

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Minerals]
columns = Calcite_mol, Albite_mol, Kfeld_mol, Montmor_mol, Chlorite_mol
scale = 1
ylabel = Moles

[plot.Exchanger]
columns = NaX_mol, MgX2_mol, CaX2_mol, KX_mol
scale = 1
ylabel = mol/kgw
