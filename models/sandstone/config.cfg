# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).

[run]
enabled = true              # false skips this model.
model_encoding = utf-8      # Encoding of the .phr file, e.g. utf-8, cp1252, cp1254.
n_simulations = 8
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 4                 # Parallel PHREEQC runs.
timeout_s = 7200            # Per simulation, in seconds.
smoke_test = true           # Run the median of every parameter once before the batch.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[sampling]
method = lhs                # lhs (Latin hypercube), sobol (use a power of 2 for n_simulations) or random.
seed = auto                 # auto or an integer. The seed used is stored in the run.

[model]
volume_m3 = 1.0
total_pressure_atm = 60.0   # Must match "-pressure" in the template.
h2_pressure_atm = 1.1843    # Fixed in the template as Hdg(g).
normalize_mineral_fractions = true  # Scale the mineral fractions to sum to 1.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   loguniform    low, high
#   triangular    low, mode, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#                 (keeps the base model's ratio to another parameter)
#
# The bounds are the ranges of the original script (Sandstone.py). Where a
# distribution has a centre, it is the value of the base model, and the
# spread puts the bounds at about 2 standard deviations
# ((log10 high - log10 low) / 4).
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, CH4, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pN2 and the mineral fraction parameters.

# Porosity: normal. Classic result for reservoir rock (Law, cited in
# Bennion & Griffiths 1966, SPE J.); permeability is the lognormal one.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the Trona model.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: uniform, as in the Trona model.
[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

# Dissolved species (mol/kgw): lognormal, as in the Trona model (Ahrens 1954;
# groundwater background studies). Medians are the base model composition.
[parameter.HCO3]
# as alkalinity
distribution = lognormal
low = 1e-2
high = 2e-1
median = 0.03445
sigma_log10 = 0.33
placeholder = {HCO3}

[parameter.Na]
distribution = lognormal
low = 1e-2
high = 1e-1
median = 0.06278
sigma_log10 = 0.25
placeholder = {NA}

# The base value (6.5e-4) is this range's lower bound, so the median is the
# geometric centre of the range instead.
[parameter.K]
distribution = lognormal
low = 6.5e-4
high = 1e-3
median = 8.062e-4
sigma_log10 = 0.047
placeholder = {K}

# Cl keeps the base model's Cl/Na ratio, as in the original script.
[parameter.Cl]
distribution = proportional
to = Na
base = 0.01162
base_to = 0.06278
placeholder = {CL}

[parameter.Ca]
distribution = lognormal
low = 1e-4
high = 5e-3
median = 0.00124
sigma_log10 = 0.42
placeholder = {CA}

# The base model has Mg = 0.00157, above this range's upper bound (1e-3),
# so the median is the geometric centre of the range instead.
[parameter.Mg]
distribution = lognormal
low = 1e-5
high = 1e-3
median = 1e-4
sigma_log10 = 0.5
placeholder = {MG}

[parameter.S6]
distribution = lognormal
low = 1e-4
high = 5e-2
median = 0.01303
sigma_log10 = 0.67
placeholder = {S(6)}

# Gas partial pressures (atm): lognormal. Non-hydrocarbon gas contents in
# natural gas range from traces to large fractions and are strongly
# right-skewed; lognormal is the usual choice for such data, but I found no
# source fitting it to CO2, N2 or H2S specifically. Medians are the base model.
[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 3.68428
sigma_log10 = 1.75
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 0.003684
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pN2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.92107
sigma_log10 = 1.75
placeholder = {N2}

# Mineral volume fractions of the solid: uniform within +/-40 % of the base
# fraction, then scaled to sum to 1 (normalize_mineral_fractions), as in the
# original script.
[parameter.Quartz_fraction]
distribution = uniform
low = 0.48
high = 1.12

[parameter.Calcite_fraction]
distribution = uniform
low = 0.036
high = 0.084

[parameter.Pyrite_fraction]
distribution = uniform
low = 0.018
high = 0.042

[parameter.Barite_fraction]
distribution = uniform
low = 0.018
high = 0.042

[parameter.Illite_fraction]
distribution = uniform
low = 0.012
high = 0.028

[parameter.Hematite_fraction]
distribution = uniform
low = 0.012
high = 0.028

[parameter.Kaolinite_fraction]
distribution = uniform
low = 0.012
high = 0.028

[parameter.Albite_fraction]
distribution = uniform
low = 0.012
high = 0.028

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its volume fraction of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
# -----------------------------------------------------------------------------
[mineral.Quartz]
fraction_parameter = Quartz_fraction
moles_placeholder = {QUARTZ_MOLES}
area_placeholder = {QUARTZ_AREA}
diameter_m = 200e-6
density_kg_m3 = 2650
molar_mass_kg_mol = 60.08e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Calcite]
fraction_parameter = Calcite_fraction
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 2710
molar_mass_kg_mol = 100.09e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Pyrite]
fraction_parameter = Pyrite_fraction
moles_placeholder = {PYRITE_MOLES}
area_placeholder = {PYRITE_AREA}
diameter_m = 10e-6
density_kg_m3 = 5000
molar_mass_kg_mol = 119.97e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Barite]
fraction_parameter = Barite_fraction
moles_placeholder = {BARITE_MOLES}
area_placeholder = {BARITE_AREA}
diameter_m = 10e-6
density_kg_m3 = 4500
molar_mass_kg_mol = 233.39e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Illite]
fraction_parameter = Illite_fraction
moles_placeholder = {ILLITE_MOLES}
area_placeholder = {ILLITE_AREA}
diameter_m = 1e-6
density_kg_m3 = 2700
molar_mass_kg_mol = 385.07e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Hematite]
fraction_parameter = Hematite_fraction
moles_placeholder = {HEMATITE_MOLES}
area_placeholder = {HEMATITE_AREA}
diameter_m = 10e-6
density_kg_m3 = 5260
molar_mass_kg_mol = 159.69e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Kaolinite]
fraction_parameter = Kaolinite_fraction
moles_placeholder = {KAOLINITE_MOLES}
area_placeholder = {KAOLINITE_AREA}
diameter_m = 1e-6
density_kg_m3 = 2620
molar_mass_kg_mol = 258.16e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Albite]
fraction_parameter = Albite_fraction
moles_placeholder = {ALBITE_MOLES}
area_placeholder = {ALBITE_AREA}
diameter_m = 200e-6
density_kg_m3 = 2620
molar_mass_kg_mol = 262.22e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, CO2_g_mol, CH4_g_mol, SO4_mol, Formate, Acetate,
              HS-_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
# Columns that must change between the first kinetic step and the end.
# Catches switched-off reactions (the MIN bug gives a change of exactly 0).
# Leave empty to switch the check off.
must_change = SR_H2, SR_AC, SR_FOR
change_atol = 1e-14         # Absolute; real progress here is ~1e-8 mol or more.

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value"
# (the format of the original script).
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {K}, {CL}, {CA}, {MG}, {S(6)},
             {CH4}, {CO2}, {N2}, {H2S},
             {QUARTZ_MOLES}, {CALCITE_MOLES}, {PYRITE_MOLES}, {BARITE_MOLES},
             {ILLITE_MOLES}, {HEMATITE_MOLES}, {KAOLINITE_MOLES}, {ALBITE_MOLES},
             {QUARTZ_AREA}, {CALCITE_AREA}, {PYRITE_AREA}, {BARITE_AREA},
             {ILLITE_AREA}, {HEMATITE_AREA}, {KAOLINITE_AREA}, {ALBITE_AREA}
drop_columns = Ca_tot, S6_tot   # Left out of the output files. Duplicates of Ca_mol and SO4_mol.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row
                                # (before gas and kinetics are set up: pH 7, no gas, KIN() = 0).

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# scale multiplies the values (1000 converts mol to mmol).
# -----------------------------------------------------------------------------
[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Sandstone model]
columns = H2_g_mol, CO2_g_mol, SO4_mol, Formate, Acetate, Ca_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Barite and Calcite]
columns = Barite, Calcite
scale = 1
ylabel = Moles

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Ca Fe HS-]
columns = Ca_mol, Fe_mol, HS-_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Iron reduction]
columns = IR_H2, IR_AC, IR_FOR
scale = 1
ylabel = Kinetic reactant (mol)

[plot.Solution]
columns = HCO3_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
scale = 1000
ylabel = Amount (mmol)
