[run]
enabled = false              # false skips this model.
n_simulations = 8
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 4                 # Parallel PHREEQC runs.
timeout_s = 7200            # Per simulation, in seconds.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[model]
cushion_gas = CH4           # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - N2.

[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

[parameter.HCO3]
distribution = lognormal
low = 1e-3
high = 2e-1
median = 0.03445
sigma_log10 = 0.58
placeholder = {HCO3}

[parameter.Na]
distribution = lognormal
low = 1e-2
high = 3.0
median = 0.06278
sigma_log10 = 0.62
placeholder = {NA}

[parameter.Cl]
distribution = proportional
to = Na
base = 0.01162
base_to = 0.06278
placeholder = {CL}

[parameter.Ca]
distribution = lognormal
low = 1e-4
high = 5e-3
median = 0.00124
sigma_log10 = 0.42
placeholder = {CA}

[parameter.Mg]
distribution = lognormal
low = 1e-5
high = 1e-3
median = 1e-4
sigma_log10 = 0.5
placeholder = {MG}

[parameter.S6]
distribution = lognormal
low = 1e-4
high = 5e-2
median = 0.01303
sigma_log10 = 0.67
placeholder = {S(6)}

[parameter.pCO2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 3.68428
sigma_log10 = 1.75
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 0.003684
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pN2]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.92107
sigma_log10 = 1.75
placeholder = {N2}

[parameter.Calcite_pct]
distribution = constant
value = 100

[mineral.Calcite]
fraction_parameter = Calcite_pct
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 100e-6
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.09e-3
reactive_fraction = 1e-3    # Applied to both moles and area, as before.
moles_multiplier = 1
area_multiplier = 1

[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, CO2_g_mol, CH4_g_mol, SO4_mol, Formate, Acetate,
              HS-_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
must_change =
change_atol = 1e-14         # Absolute; real progress here is ~1e-8 mol or more.

[output]
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {HCO3}, {NA}, {CL}, {CA}, {MG}, {S(6)},
             {CH4}, {CO2}, {N2}, {H2S},
             {CALCITE_MOLES}, {CALCITE_AREA}
drop_columns = Ca_tot, S6_tot   # Left out of the output files. Duplicates of Ca_mol and SO4_mol.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Calcite model]
columns = H2_g_mol, CO2_g_mol, SO4_mol, Formate, Acetate, Ca_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Ca Fe HS-]
columns = Ca_mol, Fe_mol, HS-_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Iron reduction]
columns = IR_H2, IR_AC, IR_FOR
scale = 1
ylabel = Kinetic reactant (mol)

[plot.Solution]
columns = HCO3_mol, Na_tot, Mg_tot, Cl_tot, Ca_tot, S6_tot
scale = 1000
ylabel = Amount (mmol)
