# Configuration for one model. It lives in models/<name>/ next to <name>.phr,
# and datagen.py runs every enabled model in models/. Lists are comma-separated.
# Comments start with # (after a space when on the same line as a value).
#
# halite-exp: Tuz Gölü halite, from our batch experiment (halite, anhydrite,
# calcite; 2 bar H2 + 58 bar N2,
# 50 °C). Scaled up to the reservoir like the other models: a 1 m³ REV whose
# pore space (porosity) is shared between water and gas, with N2 as the
# cushion gas.

[run]
enabled = true              # false skips this model.
model_encoding = utf-8      # Encoding of the .phr file, e.g. utf-8, cp1252, cp1254.
n_simulations = 10
debug = true                # true: PHREEQC logs, rendered inputs, run.log and plots. false: none of them.
workers = 10                 # Parallel PHREEQC runs.
timeout_s = 3600            # Per simulation, in seconds.
smoke_test = true           # Run the median of every parameter once before the batch.

[phreeqc]
executable = phreeqc        # Name on PATH or full path.
database = /usr/share/phreeqc/database/phreeqc.dat

[sampling]
seed = auto                 # auto or an integer. The seed used is stored in the run.

[model]
volume_m3 = 1.0
total_pressure_atm = 60.0   # Must match "-pressure" in the template.
h2_pressure_atm = 2.0       # Fixed in the template as Hdg(g): 2 of 60, as in the experiment.
cushion_gas = N2            # Takes the rest of the pressure: 60 - H2 - CO2 - H2S - CH4.
normalize_mineral_fractions = true  # Scale the mineral fractions to sum to 1.
mineral_fraction_basis = mass       # The mineral parameters are mass percentages.

# -----------------------------------------------------------------------------
# Sampled parameters: one [parameter.<name>] section each, in this order.
# -----------------------------------------------------------------------------
# distribution = one of:
#   uniform       low, high
#   normal        mean, std            truncated to [low, high]
#   lognormal     median, sigma_log10  truncated to [low, high]
#                 (sigma_log10 = standard deviation of log10(x))
# or, not sampled:
#   constant      value
#   proportional  to, base, base_to    value = <to> * base / base_to
#
# placeholder means the value goes straight into the template. The derived
# values (volumes, N2, minerals) are computed from porosity,
# water_fraction, pCO2, pH2S, pCH4 and the mineral fraction parameters.

# Porosity: normal, as in the other models.
[parameter.porosity]
distribution = normal
low = 0.1
high = 0.3
mean = 0.2
std = 0.05

# Temperature: uniform, as in the other models; the base model's 50 °C is
# inside the range. Sets the solution, gas and reaction temperatures.
[parameter.temperature]
distribution = uniform
low = 25.0
high = 60.0
placeholder = {TEMPERATURE}

# Water fraction of the pore volume: uniform, as in the other models.
[parameter.water_fraction]
distribution = uniform
low = 0.15
high = 0.85

# Gas partial pressures (atm): lognormal, since each spans orders of
# magnitude. The same distributions in all four exp models. H2 is fixed at
# 2 atm (as in the experiment) and N2, the cushion gas, takes whatever the
# others leave of the 60 atm (cushion_gas in [model]). The experiments' gas
# had only H2 and N2, so the medians are typical reservoir values:
#   pCO2  median 0.1 atm, 1e-5 to 10 atm
#   pH2S  median 1e-4 atm (~2 ppm), 1e-6 to 1e-2 atm
#   pCH4  residual or biogenic methane: median 0.3 atm (0.5 mol%; ~0.15 atm
#         after the cut at 10 atm), 1e-6 to 10 atm (~17 mol%);
#         sigma_log10 = 1.5 puts ~6% of runs below 1e-3 atm.
# pH2S and pCH4 at 1e-6 stand in for "absent". N2 ends up between 38 and
# 58 atm.
[parameter.pCO2]
distribution = lognormal
low = 1e-5
high = 10.0
median = 0.1
sigma_log10 = 1.0
placeholder = {CO2}

[parameter.pH2S]
distribution = lognormal
low = 1e-6
high = 1e-2
median = 1e-4
sigma_log10 = 1.0
placeholder = {H2S}

[parameter.pCH4]
distribution = lognormal
low = 1e-6
high = 10.0
median = 0.3
sigma_log10 = 1.5
placeholder = {CH4}

# Mineral mass percentages of the solid (see [mineral.*] below), from the
# base model's header: halite 85 %, anhydrite 10 %, calcite 5 %. datagen.py
# converts them to volume fractions with the densities (88 / 8 / 4 vol% at
# the base values). The range is 0.6x to 1.4x of each, then scaled to sum
# to 100 %, as in the other multi-mineral models. (The base's anhydrite
# -m0 0.37 does not match its own 10 % / 0.101 m2, which give ~0.037 mol;
# the percentages are used here.)
[parameter.Halite_pct]
distribution = uniform
low = 51.0
high = 119.0

[parameter.Anhydrite_pct]
distribution = uniform
low = 6.0
high = 14.0

[parameter.Calcite_pct]
distribution = uniform
low = 3.0
high = 7.0

# -----------------------------------------------------------------------------
# Minerals: one [mineral.<name>] section each.
#   fraction_parameter  the [parameter.*] holding its mass percentage of the solid
#   moles_multiplier, area_multiplier  extra factors on the computed values
# reactive_fraction = 1e-3 on moles and area, as in the other models.
# diameter_m: 0.1 mm for every mineral, as in the base model's header (it
# gives the base's -parms areas for halite and calcite: A = 6 m / (rho d)).
# -----------------------------------------------------------------------------
[mineral.Halite]
fraction_parameter = Halite_pct
moles_placeholder = {HALITE_MOLES}
area_placeholder = {HALITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2165.0
molar_mass_kg_mol = 58.443e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Anhydrite]
fraction_parameter = Anhydrite_pct
moles_placeholder = {ANHYDRITE_MOLES}
area_placeholder = {ANHYDRITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2960.0
molar_mass_kg_mol = 136.14e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

[mineral.Calcite]
fraction_parameter = Calcite_pct
moles_placeholder = {CALCITE_MOLES}
area_placeholder = {CALCITE_AREA}
diameter_m = 1e-4
density_kg_m3 = 2710.0
molar_mass_kg_mol = 100.087e-3
reactive_fraction = 1e-3
moles_multiplier = 1
area_multiplier = 1

# -----------------------------------------------------------------------------
# Checks on completed runs. A run that fails one is stored as "flagged"
# with its inputs in failed/ and the reason in report.txt, unless
# include_flagged = true in [output].
# -----------------------------------------------------------------------------
[checks]
time_column = time_d
end_time_tolerance = 0.99   # Must reach 99% of the "-steps" time in the template.
ph_column = pH
ph_range = 0.0, 14.0
nonnegative = H2_g_mol, N2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol,
              X_SRB_mol, X_IRB_mol, Halite_mol, Anhydrite_mol, Calcite_mol
# Off for now: no column has been confirmed to change in every run.
must_change =
change_atol = 1e-14

[output]
# Lines of each input file, in this order, as "{PLACEHOLDER} value".
input_file = {TEMPERATURE}, {WATER_VOLUME}, {GAS_VOLUME},
             {CH4}, {CO2}, {N2}, {H2S},
             {HALITE_MOLES}, {HALITE_AREA},
             {ANHYDRITE_MOLES}, {ANHYDRITE_AREA},
             {CALCITE_MOLES}, {CALCITE_AREA}
drop_columns =                  # Left out of the output files.
include_flagged = false         # true saves flagged runs in input/ and output/ instead of failed/.
keep_initial_row = false        # true also keeps PHREEQC's t = 0 initial-solution row.

# -----------------------------------------------------------------------------
# Debug plots, one figure per simulation: one [plot.<title>] section per panel.
# -----------------------------------------------------------------------------
[plot.Gas composition]
columns = H2_cmol, N2_cmol, CO2_cmol, CH4_cmol
scale = 1
ylabel = Gas (cmol/mol)

[plot.pH]
columns = pH
scale = 1
ylabel = pH

[plot.Biomass]
columns = X_SRB_mol, X_IRB_mol
scale = 1
ylabel = Moles

[plot.Gas amounts]
columns = H2_g_mol, CO2_g_mol, CH4_g_mol, H2S_g_mol
scale = 1000
ylabel = Amount (mmol)

[plot.Minerals]
columns = Halite_mol, Anhydrite_mol, Calcite_mol
scale = 1
ylabel = Moles

[plot.Microbial reactions]
columns = SR_H2, IR_H2
scale = 1
ylabel = Kinetic reactant (mol)
